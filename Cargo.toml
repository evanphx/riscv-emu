[package]
name = "riscv"
version = "0.1.0"
edition = "2021"
description = "RV64GC RISC-V emulator capable of booting Linux (Rust port of markkurossi/riscv)"
license = "MIT"

[features]
default = ["jit", "gui"]
# Host display window for the virtio-gpu device.
gui = ["dep:softbuffer", "dep:winit"]
# Cranelift JIT compiler for guest code (enabled with the -jit flag).
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-native"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cranelift-codegen = { version = "0.136", optional = true }
cranelift-frontend = { version = "0.136", optional = true }
cranelift-native = { version = "0.136", optional = true }
png = "0.17"
softbuffer = { version = "0.4", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }

[profile.release]
opt-level = 3
debug = 1
codegen-units = 4
panic = "unwind"

[profile.test]
opt-level = 2

[patch.crates-io]
cranelift-codegen = { path = "vendor/cranelift-codegen" }
